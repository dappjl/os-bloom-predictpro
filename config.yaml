      - { symbol: XLP,  name: "Consumer Staples",       yahoo: XLP }
      - { symbol: XLE,  name: "Energy",                 yahoo: XLE }
      - { symbol: XLF,  name: "Financials",             yahoo: XLF }
      - { symbol: XLV,  name: "Health Care",            yahoo: XLV }
      - { symbol: XLI,  name: "Industrials",            yahoo: XLI }
      - { symbol: XLB,  name: "Materials",              yahoo: XLB }
      - { symbol: XLRE, name: "Real Estate",            yahoo: XLRE }
      - { symbol: XLU,  name: "Utilities",              yahoo: XLU }
  - title: EUROPE SECTORS
    note: iShares STOXX Europe 600 sector ETFs, Xetra, EUR
    rows:
