        asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" }
    - { chain: ETH, rpc: "https://ethereum-rpc.publicnode.com",
        pool: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2", symbol: USDC,
