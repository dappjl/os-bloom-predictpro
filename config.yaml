  strategies:      # order = dedupe priority (tiers are nested; first listing wins)
    - { id: safe,  label: Conservative }
    - { id: degen, label: Moderate }
    - { id: async, label: Dynamic }
  chains:
    - { id: 8453,  name: Base,     usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" }
    - { id: 1,     name: Ethereum, usdc: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" }
    - { id: 42161, name: Arbitrum, usdc: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831" }
  midnight_chains: [8453]   # must be a subset of chains ids above
  token_symbols:   # collateral display names; unknown addresses render truncated
    "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf": cbBTC
    "0x4200000000000000000000000000000000000006": WETH
  morpho_graphql: https://blue-api.morpho.org/graphql
